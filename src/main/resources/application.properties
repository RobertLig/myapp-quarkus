# --- JWT Verification (public key) ---
mp.jwt.verify.publickey.location=${JWT_VERIFY_PUBLIC_KEY_LOCATION}
mp.jwt.verify.issuer=your-app

# --- JWT Signing (private key) ---
smallrye.jwt.sign.key.location=${JWT_SIGNING_KEY_LOCATION}
smallrye.jwt.sign.algorithm=RS256
smallrye.jwt.new-token.issuer=your-app

# --- Local JWT keys (outside the repository) ---
%dev.mp.jwt.verify.publickey.location=${JWT_VERIFY_PUBLIC_KEY_LOCATION:${user.home}/.myapp/jwt-dev-public.pem}
%dev.smallrye.jwt.sign.key.location=${JWT_SIGNING_KEY_LOCATION:${user.home}/.myapp/jwt-dev-private.pem}
%test.mp.jwt.verify.publickey.location=${JWT_VERIFY_PUBLIC_KEY_LOCATION:${user.home}/.myapp/jwt-dev-public.pem}
%test.smallrye.jwt.sign.key.location=${JWT_SIGNING_KEY_LOCATION:${user.home}/.myapp/jwt-dev-private.pem}

# --- Security ---
quarkus.http.auth.proactive=true
quarkus.http.port=${PORT:8080}

quarkus.log.category."io.smallrye.jwt".level=INFO

google.client.id=456614025207-m4ljumnedhiku3qo8t2fgci9r02ukoci.apps.googleusercontent.com

quarkus.default-locale=en
quarkus.locales=en,pl

quarkus.rest.exception-mapping.disable-mapper-for=io.quarkus.resteasy.reactive.jackson.runtime.mappers.BuiltinMismatchedInputExceptionMapper

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS}
%dev.quarkus.http.cors.origins=http://localhost:3000
%test.quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.access-control-allow-credentials=true

# ============================================================
# PRODUCTION PROFILE - Supabase Storage S3-compatible API
# ============================================================
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%prod.bucket.name=${SUPABASE_S3_BUCKET}
%prod.quarkus.s3.aws.region=${SUPABASE_S3_REGION:eu-west-1}
%prod.quarkus.s3.endpoint-override=${SUPABASE_S3_ENDPOINT}
%prod.quarkus.s3.path-style-access=true
%prod.quarkus.s3.aws.credentials.type=static
%prod.quarkus.s3.aws.credentials.static-provider.access-key-id=${SUPABASE_S3_ACCESS_KEY_ID}
%prod.quarkus.s3.aws.credentials.static-provider.secret-access-key=${SUPABASE_S3_SECRET_ACCESS_KEY}
%prod.s3.object-url-base=${SUPABASE_S3_ENDPOINT}/${bucket.name}

# ============================================================
# LOCAL DEV PROFILE (%dev) - Uses Quarkus Dev Services & Docker
# ============================================================
%dev.bucket.name=my-local-test-bucket
%dev.s3.object-url-base=${quarkus.s3.endpoint-override}/my-local-test-bucket
%dev.quarkus.s3.aws.region=eu-central-1
%dev.quarkus.s3.aws.credentials.type=static
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=test

# Enable Quarkus Dev Services for S3 automatically
%dev.quarkus.s3.devservices.enabled=true
%dev.quarkus.s3.devservices.buckets=my-local-test-bucket
# Keep the existing Hibernate-managed disposable schema in dev and tests.
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.bucket.name=my-local-test-bucket
%test.s3.object-url-base=${quarkus.s3.endpoint-override}/my-local-test-bucket
%test.quarkus.s3.aws.region=eu-central-1
%test.quarkus.s3.aws.credentials.type=static
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=test
%test.quarkus.s3.devservices.enabled=true
%test.quarkus.s3.devservices.buckets=my-local-test-bucket

# MyMemory Free Translation API
quarkus.rest-client.mymemory-api.url=https://api.mymemory.translated.net

# Batch fetching
quarkus.hibernate-orm.batch-fetch-size=25
